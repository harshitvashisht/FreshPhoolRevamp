services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freshphool
      POSTGRES_PASSWORD: freshphool
      POSTGRES_DB: freshphool
    ports:
      - "5432:5432"
    volumes:
      - freshphool_pg:/var/lib/postgresql/data

volumes:
  freshphool_pg:
